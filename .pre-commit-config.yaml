repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        priority: 10
      - id: check-toml
        priority: 10
      - id: end-of-file-fixer
        priority: 10
      - id: trailing-whitespace
        priority: 10
      - id: no-commit-to-branch
        args: [--branch, main]
        priority: 0
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations
        priority: 0
      - id: python-check-blanket-noqa
        priority: 0
      - id: python-no-eval
        priority: 0
      - id: python-no-log-warn
        priority: 0
      - id: text-unicode-replacement-char
        priority: 0
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        priority: 0
        fail_fast: true
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        priority: 10
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.5
    hooks:
      - id: sync-pre-commit-deps
        priority: 0
        fail_fast: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.21
    hooks:
      - id: uv-lock
        priority: 0
        fail_fast: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # types_or on every hook: since ruff 0.16 the hooks also pick up markdown
      # (python inside ``` blocks), and the README examples are illustrative.
      - id: ruff-check
        args: [--config, pyproject.toml, --fix]
        types_or: [python, pyi]
        priority: 21
      - id: ruff-check
        args: [--config, pyproject.toml, --select, I, --fix]
        types_or: [python, pyi]
        priority: 22
      - id: ruff-format
        args: [--config, pyproject.toml]
        types_or: [python, pyi]
        priority: 23
        fail_fast: true
  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        priority: 30
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.85
    hooks:
      # Scope (src/tests/examples) and target version live in [tool.ty] in pyproject.toml.
      - id: ty
        always_run: false
        priority: 30
