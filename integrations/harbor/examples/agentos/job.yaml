# Harbor job for the AgentOS demo (option c). Paths are relative to integrations/harbor, where you run:
#   simulhausen harbor export examples/agentos/scenarios.toml --output-dir tasks
#   harbor run -c examples/agentos/job.yaml -y
job_name: support-agent-v1
n_attempts: 1
n_concurrent_trials: 2
environment:
  type: docker
  extra_docker_compose:
    - examples/agentos/agentos-sidecar.yaml
agents:
  - import_path: simulhausen_harbor:AgentOSAgent
    # The agent under test's identity: results are grouped by agent__model__dataset.
    model_name: support-agent@v1
    kwargs:
      base_url: http://agent-api:7777
      agent_id: support
    # Agent phase only (the user simulator). The judge gets its key from the tasks' [verifier.env].
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
datasets:
  - path: tasks
metrics:
  # pass_rate = PASS / (PASS + FAIL): trials without a reward (WARN) are left out instead of counting as 0.
  - type: uv-script
    kwargs:
      script_path: src/simulhausen_harbor/metric.py
