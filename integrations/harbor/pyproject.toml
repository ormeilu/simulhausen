[project]
name = "simulhausen-harbor"
version = "0.1.0"
description = "Harbor agents that evaluate HTTP agents (agno AgentOS, OpenAI-compatible, A2A, LangGraph) with simulhausen's user simulator."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ilya Lubenets", email = "lubenets.ilya.igorevich@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["agents", "agno", "harbor", "llm", "testing", "simulation", "evaluation", "llm-as-a-judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # The agent classes subclass harbor.agents.installed.base.BaseInstalledAgent, whose
    # constructor and exec helpers still move between minor releases.
    "harbor>=0.24,<0.25",
]

[project.urls]
Homepage = "https://github.com/ormeilu/simulhausen/tree/main/integrations/harbor"
Repository = "https://github.com/ormeilu/simulhausen"
Issues = "https://github.com/ormeilu/simulhausen/issues"

[build-system]
requires = ["uv_build>=0.10.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
# Lets ty check examples/agentos/app.py against the agno the demo image installs (keep both pins equal).
examples = [
    "agno==3.1.1",
]

[tool.uv]
default-groups = ["dev", "examples"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
# Same selection as the root project: https://docs.astral.sh/ruff/rules/
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "ASYNC",
    "BLE",
    "C4",
    "LOG",
    "G",
    "PERF",
    "TRY",
    "TC",
    "RUF",
]
ignore = [
    "FIX",
    "TRY003",
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --cov=simulhausen_harbor --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ty.environment]
# Lowest supported runtime: ty resolves stdlib stubs for it, so newer-only APIs get flagged.
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.rules]
unused-ignore-comment = "ignore"
